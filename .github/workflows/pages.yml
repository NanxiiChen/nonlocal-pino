name: Deploy technical report

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - website/**
      - assets/pino-main/**
      - assets/pino-architecture/**
      - artifacts/pino_main_figures.json
      - assets/pino-setups/**
      - artifacts/pino_setup_figures.json
      - assets/pino-studies/particle_corrosion2d_fem_distribution.*
      - artifacts/ceramic_fem_comparison_publication.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/configure-pages@v6.0.0
      - name: Build the report
        working-directory: website
        run: |
          npm ci
          npm run build
          test -s dist/index.html
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website/dist/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
