[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nonlocal_pinn", "examples"]

[project]
name = "nonlocal-pinn"
version = "0.1.0"
description = "Nonlocal operators and physics-informed neural networks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13.8",
    "jax[cuda13]>=0.10.1",
    "matplotlib>=3.11.0",
    "ml-collections>=1.1.0",
    "optax>=0.2.8",
    "soap-jax==0.2.2",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.5",
    "scipy>=1.15.0",
]

[project.optional-dependencies]
mesh = ["gmsh==4.15.2"]

[tool.uv.sources]
soap-jax = { git = "https://github.com/haydn-jones/SOAP_JAX", rev = "a7c92f174c49b13136294a94ae0d46266b4f671f" }
